# Display names of the models in the results page (jevarena-mm results-page). One table per model id as the reports
# name it. type: "system-one" for decision models with their own read-out (a decision head, a scoring server),
# "mllm" for multimodal LLMs used as classifiers (label-token probabilities). source: "run" for models run for this
# release, "recorded" for runs recorded earlier with the same input policy. status = "running": kept off the tables until its runs
# finish, and listed as running.

