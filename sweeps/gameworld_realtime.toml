# GameWorld in realtime for the 33 models of the results page (docs/envs.md, docs/latency.md). `jevarena-mm
# sweep-report sweeps/gameworld_realtime.toml` reports, from the episode caches, each model's realtime episodes at
# its H100 latency (latency_gpu = "h100": results/summary/latency/h100/) beside its paused ones; they are played with
# `jevarena-mm play --model <spec> --env loop.game/gameworld --realtime --latency-gpu h100`. Each spec is the
# model's accuracy-run spec, so the model id is the one of its results.
name = "gameworld_realtime"
tasks = []
envs = ["loop.game/gameworld"]
realtime = true

[defaults]
static = false
latency_gpu = "h100"

[[models]]
spec = "onejev:OmniJev/OneJev-9B"

[[models]]
spec = "onejev:OmniJev/OneJev-4B"

[[models]]
spec = "onejev:OmniJev/OneJev-0.8B"

[[models]]
spec = "jev_omni@head=ferdinandl007/jev-omni-general-head-v3"

[[models]]
spec = "raya"

[[models]]
spec = "clef"

[[models]]
spec = "clef:Cloudflare/clef@gpus=2"

[[models]]
