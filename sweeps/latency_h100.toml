gpus = 2
env = "vllm"

[[models]]
spec = "lm:Qwen/Qwen3-Omni-30B-A3B-Instruct@tp=2,gpu=0.8,maxlen=65536,batched=32768"  # as run on the H100 PCIe nodes: one H100 ran out of memory with the planned options
gpus = 2
env = "vllm"
time = "06:00:00"

[[models]]
