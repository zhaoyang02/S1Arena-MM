async_chunk: true
connectors:
  connector_of_shared_memory:
    extra:
      cfm_graph_bucket_frames: 16
      cfm_max_graphs: 32
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      connector_get_max_wait: 300
      connector_get_max_wait_first_chunk: 3000
      connector_get_sleep_s: 0.01
      enable_cfm_graph: true
      enable_hift_graph: true
    name: SharedMemoryConnector
duplex_session:
  max_sessions: 1
enable_prefix_caching: false
pipeline: minicpmo_4_5
platforms:
  cuda:
    stages:
    - kv_cache_memory_bytes: 2147483648
      stage_id: 1
  npu:
    stages:
    - compilation_config:
        cudagraph_mode: PIECEWISE
      max_num_batched_tokens: 8192
      stage_id: 0
    - compilation_config:
        cudagraph_mode: PIECEWISE
      max_num_batched_tokens: 8192
      stage_id: 1
    - additional_config:
        code2wav_enable_npu_graph: true
        code2wav_max_npu_graphs: 32
      stage_id: 2
session_mode: duplex
stages:
- default_sampling_params:
    detokenize: true
    max_tokens: 2048
    repetition_penalty: 1.0
    seed: 42
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  devices: '0'
  enforce_eager: true
  gpu_memory_utilization: 0.85
  interleave_mm_strings: true
  limit_mm_per_prompt:
    audio: 64
    image: 64
    video: 1
  max_model_len: 8192
  max_num_batched_tokens: 8192
  max_num_seqs: 1
  media_io_kwargs:
    video:
      fps: 1
      num_frames: 128
  stage_id: 0
  tensor_parallel_size: 1
- default_sampling_params:
    detokenize: false
    max_tokens: 4096
    min_tokens: 50
    repetition_penalty: 1.05
    seed: 42
    temperature: 0.8
    top_k: 25
    top_p: 0.85
  devices: '1'
  enforce_eager: true
  gpu_memory_utilization: 0.7
  max_model_len: 4096
  max_num_batched_tokens: 8192
  max_num_seqs: 1
  output_connectors:
    to_stage_2: connector_of_shared_memory
  stage_id: 1
- default_sampling_params:
    detokenize: true
    max_tokens: 65536
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  devices: '2'
  enable_chunked_prefill: false
  enforce_eager: true
  gpu_memory_utilization: 0.7
  input_connectors:
    from_stage_1: connector_of_shared_memory
  max_model_len: 65536
  max_num_batched_tokens: 65536
  max_num_seqs: 1
  stage_id: 2
trust_remote_code: true
