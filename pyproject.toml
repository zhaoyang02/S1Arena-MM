[project]
name = "jevarena-mm"
version = "1.0.0"
description = "S1Arena-MM: image, video and audio decisions for System-1 decision models and multimodal LLMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "huggingface_hub>=1.0",
]

[project.scripts]
jevarena-mm = "jevarena_mm.cli:main"

[project.optional-dependencies]
image = ["pillow>=10.4,!=11.0.*"]  # 11.0 encodes 4 of the images scripts/fetch/jevarena_img.py rebuilds differently
video = ["av>=12.0", "pillow>=10.0", "pyarrow>=14"]  # pyarrow: Video-MME recipe
audio = ["av>=12.0", "soundfile==0.14.0", "pyarrow>=14"]  # soundfile: scripts/fetch/audio_delivery.py decodes with libsndfile 1.2.2
audio-gemini = ["av>=12.0", "httpx>=0.27"]
audio-stream = ["numpy==2.4.6", "soundfile==0.14.0", "scipy==1.17.1"]
# The two streaming clients need separate environments: google-genai requires websockets<17.
audio-stream-gemini = ["google-genai==2.28.0", "websockets==16.1.1"]
audio-stream-qwen = ["websockets==17.2"]
# The pinned environment of the audio_qwen adapter; install it separately from .[jev] (different Transformers versions).
audio-qwen = ["av>=12.0", "torch>=2.6", "transformers==4.57.1", "accelerate>=1.0", "librosa>=0.10", "soundfile>=0.12"]
hf = ["datasets>=3.0"]
# OneJev and Jev-Omni on a CUDA GPU. OneJev also needs its official engine: pip install "qev @ git+https://github.com/OmniJev/OneJev@81ce62f1597c91e46767d4d02d6ac2e18534fe94" (or ONEJEV_ENGINE_DIR)
jev = ["torch>=2.6", "torchvision>=0.21", "transformers==5.17.0", "accelerate>=1.0", "safetensors>=0.4", "jinja2>=3.1", "librosa>=0.10", "pillow>=10.0", "av>=12.0"]
tokens = ["tiktoken>=0.7"]
ego4d = ["boto3>=1.34"]  # scripts/fetch/ego4d.py
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevarena_mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".cache", "media", "data_local"]

[tool.ruff.lint]
select = ["F"]  # real errors only (undefined names, unused imports and variables); no style rules

[tool.ruff.lint.per-file-ignores]
# left as they are: unused imports in the image model servers, an unused variable in the image sweep script
"jevarena_mm/models/servers/*" = ["F401"]
"scripts/img/sweep_gpu.py" = ["F841"]
